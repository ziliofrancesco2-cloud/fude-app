name: Compila APK

on:
  push:
    branches: [ main ]
    paths: [ 'app/**', 'build.gradle', 'settings.gradle', '.github/workflows/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Compila
        run: gradle assembleRelease --no-daemon

      - name: Rinomina
        run: cp app/build/outputs/apk/release/app-release.apk Fude.apk

      - uses: actions/upload-artifact@v5
        with:
          name: Fude-apk
          path: Fude.apk
